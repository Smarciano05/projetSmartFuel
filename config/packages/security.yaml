security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        # 1. On remplace users_in_memory par ton entité Pompiste
        app_pompiste_provider:
            entity:
                class: App\Entity\Pompiste
                property: email # Le champ qui sert d'identifiant (ton login)

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        main:
            lazy: true
            # 2. On dit au firewall d'utiliser le provider Pompiste
            provider: app_pompiste_provider

            # 3. On active le formulaire de connexion
            form_login:
                login_path: app_login    # Nom de la route de ta page de login
                check_path: app_login    # La route où le formulaire est soumis
                enable_csrf: true        # Protection contre les attaques CSRF
                default_target_path: /   # Où rediriger après le succès (ex: /pompiste)

            # 4. On active la déconnexion
            logout:
                path: app_logout
                # where to redirect after logout
                # target: app_any_route
                # target: app_any_route

    access_control:
        # Tu peux restreindre l'accès à tes pages ici
        # - { path: ^/pompiste, roles: ROLE_USER }